name: Build

# 发布前校验入口：main 推送、版本 tag 与手动触发都只跑 validate.yml 的检查。
# Android APK 的构建与 GitHub Release 发布由 android-apk.yml 负责，
# 这里不再重复构建，避免同一个 tag 触发两次构建、两个工作流同时写同一个 Release。
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

# 同一 ref 的新推送取消上一次未完成的校验；tag 运行不取消，保留完整的发布前检查记录。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  validate:
    uses: ./.github/workflows/validate.yml
    permissions:
      contents: read
